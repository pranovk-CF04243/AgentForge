openapi: 3.0.3
info:
  title: AgentForge Enterprise Control Plane API
  version: 1.0.0
  description: |
    Production-grade OpenAPI 3.0 specification for AgentForge enterprise multi-tenancy,
    RBAC (Roles & Permissions), API Key lifecycle management, comprehensive Audit Logs,
    and Stripe Payment Gateway integration (Payment Intents, Checkout Sessions, Webhooks).
servers:
  - url: https://api.agentforge.ai/v1
    description: Production Cluster
  - url: http://localhost:8080/v1
    description: Local Development Server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /organizations:
    post:
      summary: Create Organization
      description: Provisions a new enterprise organization tenant.
      operationId: createOrganization
      tags:
        - Organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      summary: List Organizations
      description: Retrieve list of organizations (Admin only).
      operationId: listOrganizations
      tags:
        - Organizations
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of organizations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  total:
                    type: integer

  /organizations/{orgId}:
    get:
      summary: Get Organization by ID
      operationId: getOrganization
      tags:
        - Organizations
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{orgId}/roles:
    get:
      summary: List Roles for Organization
      operationId: listOrganizationRoles
      tags:
        - RBAC
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of roles with associated permissions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      summary: Create Role
      operationId: createRole
      tags:
        - RBAC
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'

  /organizations/{orgId}/api-keys:
    get:
      summary: List API Keys
      operationId: listApiKeys
      tags:
        - API Keys
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of API keys for the organization.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
    post:
      summary: Issue API Key
      description: Generates a new cryptographically secure API key. The raw secret is returned only once.
      operationId: createApiKey
      tags:
        - API Keys
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key successfully issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreationResponse'

  /organizations/{orgId}/api-keys/{keyId}:
    delete:
      summary: Revoke API Key
      operationId: revokeApiKey
      tags:
        - API Keys
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key successfully revoked.
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{orgId}/audit-logs:
    get:
      summary: Query Audit Logs
      description: Retrieve immutable audit logs for compliance and enterprise tracking.
      operationId: listAuditLogs
      tags:
        - Audit Logs
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated audit log records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  total:
                    type: integer

  # =====================================================================
  # PAYMENT GATEWAY ENDPOINTS (Stripe Integration)
  # =====================================================================

  /organizations/{orgId}/payments/payment-intents:
    post:
      summary: Create Payment Intent
      description: |
        Creates a Stripe Payment Intent for custom payment flows (e.g. Card, US Bank Account).
        Supports Idempotency Key header for safe retry execution.
      operationId: createPaymentIntent
      tags:
        - Payments
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique client-generated key to ensure idempotent request processing (UUID or unique string).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '201':
          description: Payment Intent successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized / Invalid API Key.

  /organizations/{orgId}/payments/checkout-sessions:
    post:
      summary: Create Checkout Session
      description: |
        Creates a Stripe Checkout Session for hosted payment pages (one-time or recurring subscriptions).
        Supports Idempotency Key header for safe retry execution.
      operationId: createCheckoutSession
      tags:
        - Payments
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique client-generated key for idempotent request handling.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
      responses:
        '201':
          description: Checkout Session successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /webhooks/stripe:
    post:
      summary: Stripe Webhook Receiver
      description: |
        Receives asynchronous event notifications from Stripe.
        Requires valid Stripe-Signature header for HMAC SHA-256 webhook signature verification.
        Guarantees idempotent event processing via the stripe_webhook_events event ledger.
      operationId: handleStripeWebhook
      tags:
        - Webhooks
      security: [] # Webhooks use Stripe-Signature HMAC validation instead of Bearer/ApiKey
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: HMAC SHA-256 signature generated by Stripe using webhook signing secret.
          schema:
            type: string
            example: "t=1680000000,v1=abcdef0123456789..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe Event JSON payload.
              additionalProperties: true
      responses:
        '200':
          description: Webhook received and successfully processed (or idempotent duplicate skipped).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
                  event_id:
                    type: string
                    example: "evt_3MowXYZ123456789"
        '400':
          description: Invalid webhook payload or missing Stripe-Signature header.
        '401':
          description: Webhook signature verification failed (HMAC mismatch).

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated user sessions.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Enterprise API key for programmatic access.

  schemas:
    Organization:
      type: object
      required:
        - id
        - name
        - slug
        - tier
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        tier:
          type: string
          enum: [free, startup, enterprise]
        created_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
        slug:
          type: string
        tier:
          type: string
          enum: [free, startup, enterprise]
          default: free

    Role:
      type: object
      required:
        - id
        - name
        - permissions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    CreateRoleRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    ApiKey:
      type: object
      required:
        - id
        - name
        - key_prefix
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          example: "af_live_9x8d7"
        scopes:
          type: array
          items:
            type: string
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time

    ApiKeyCreationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required:
            - secret_key
          properties:
            secret_key:
              type: string
              description: Raw secret key. Shown only once upon creation.

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        actor_email:
          type: string
        actor_type:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        request_id:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    CreatePaymentIntentRequest:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          description: Amount in smallest currency unit (e.g. cents for USD, i.e. 1000 = $10.00).
          example: 2500
        currency:
          type: string
          description: Three-letter ISO currency code.
          default: usd
          example: "usd"
        payment_method_types:
          type: array
          items:
            type: string
          example: ["card"]
        metadata:
          type: object
          additionalProperties: true
          description: Key-value metadata attached to Stripe payment intent.

    PaymentIntentResponse:
      type: object
      required:
        - id
        - client_secret
        - status
        - amount
        - currency
      properties:
        id:
          type: string
          description: Stripe Payment Intent ID (e.g. pi_3Mow...)
          example: "pi_3MowXYZ123456789"
        client_secret:
          type: string
          description: Client secret required by Stripe.js to confirm payment on frontend.
          example: "pi_3MowXYZ123456789_secret_abc123"
        status:
          type: string
          description: Current payment intent status (e.g. requires_payment_method, succeeded).
          example: "requires_payment_method"
        amount:
          type: integer
          example: 2500
        currency:
          type: string
          example: "usd"
        created_at:
          type: string
          format: date-time

    CreateCheckoutSessionRequest:
      type: object
      required:
        - success_url
        - cancel_url
        - line_items
      properties:
        mode:
          type: string
          enum: [payment, subscription, setup]
          default: payment
          description: Checkout session mode.
        success_url:
          type: string
          format: uri
          description: URL where Stripe redirects upon successful payment.
          example: "https://app.agentforge.ai/checkout/success?session_id={CHECKOUT_SESSION_ID}"
        cancel_url:
          type: string
          format: uri
          description: URL where Stripe redirects if user cancels checkout.
          example: "https://app.agentforge.ai/checkout/cancel"
        line_items:
          type: array
          items:
            type: object
            required:
              - price_data
              - quantity
            properties:
              price_data:
                type: object
                required:
                  - currency
                  - unit_amount
                  - product_data
                properties:
                  currency:
                    type: string
                    example: "usd"
                  unit_amount:
                    type: integer
                    example: 4900
                  product_data:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        example: "AgentForge Pro Subscription"
                      description:
                        type: string
                        example: "Monthly access to advanced autonomous agents."
              quantity:
                type: integer
                example: 1
        metadata:
          type: object
          additionalProperties: true

    CheckoutSessionResponse:
      type: object
      required:
        - id
        - url
        - status
        - payment_status
      properties:
        id:
          type: string
          description: Stripe Checkout Session ID (e.g. cs_live_...)
          example: "cs_live_b1XYZ..."
        url:
          type: string
          format: uri
          description: Hosted Stripe Checkout URL to redirect the user to.
          example: "https://checkout.stripe.com/c/pay/cs_live_..."
        status:
          type: string
          enum: [open, complete, expired]
          example: "open"
        payment_status:
          type: string
          enum: [paid, unpaid, no_payment_required]
          example: "unpaid"
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Invalid request payload or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict (e.g. duplicate slug or email).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
